appId: com.arkdevs.arksql
productName: ArkSQL
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: backend/bin/
    to: backend/
    filter:
      - svcide-backend.exe
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ArkSQL
electronDownload:
  cache: .electron-cache
npmRebuild: false
